<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="金华徒步">
  <title>金华徒步</title>
  <!-- 16px 专用：不是把大图缩小，是重画。大图缩到 16px 会糊成一团（太阳变黄绿污渍、
       山脊全是半透明过渡色）。这里太阳放大、脊线压到半像素上，山同样落到底边。
       跟大图保持同一构型：绿底、白双峰、右上一点太阳。 -->
  <rect width="16" height="16" rx="3.5" ry="3.5" fill="#059669"/>
  <circle cx="11.5" cy="4" r="2.25" fill="#fcd34d"/>
  <path d="M0 16 L5.5 5 L9 10 L10.5 8 L16 16 Z" fill="#ffffff"/>
</svg>
