<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>金华徒步路线</title>
<!-- maplibre 的 CSS/JS 改走国内 CDN（七牛 staticfile）：实测完整下载 415ms，
     源站（GitHub Pages 东京）749ms。CDN 上是同版 5.6.0 的压缩构建。
     任一路失败都回落到本地 vendor/。兜底函数必须在 <head> 里定义 ——
     放进 app.js 的话，CDN 秒挂时 app.js 还没执行到，回调就丢了。 -->
<script>
window.__fallbackMapCss = function () {
  var l = document.createElement('link');
  l.rel = 'stylesheet'; l.href = 'vendor/maplibre-gl.css';
  document.head.appendChild(l);
};
window.__fallbackMapLib = function () {
  var s = document.createElement('script');
  s.src = 'vendor/maplibre-gl.js';
  s.onload = function () { window.__initMap && window.__initMap(); };
  document.head.appendChild(s);
};
</script>
<!-- preload 转 stylesheet：样式不阻塞渲染。地图本来也是晚一步才建，
     没必要让首屏列表等这份只给地图用的 CSS。 -->
<link rel="preload" as="style"
      href="https://cdn.staticfile.org/maplibre-gl/5.6.0/maplibre-gl.min.css"
      onload="this.onload=null;this.rel='stylesheet'"
      onerror="window.__fallbackMapCss()">
<link rel="stylesheet" href="style.css">

<!-- 底图在别的域，提前建连接。默认样式和瓦片全在 openfreemap，实测境内
     首次连它容易 TLS 断连，早点握手能少等一轮。 -->
<link rel="preconnect" href="https://cdn.staticfile.org">
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="dns-prefetch" href="https://tiles.openfreemap.org">
<link rel="dns-prefetch" href="https://tile.opentopomap.org">
<link rel="dns-prefetch" href="https://server.arcgisonline.com">
<link rel="dns-prefetch" href="https://hm.baidu.com">

<!-- 百度统计。**故意不按官方那段直接插进 head**：官方那段在 DOM 解析时就发请求，
     会跟 routes.geom.js（115KB）和底图瓦片抢带宽 —— 首屏那 1.9 秒是这个站的命根子，
     统计不该来分这一杯。这里只放一个队列 + 延迟注入器：零请求、零阻塞，
     等页面 load 之后再趁浏览器空闲去拉 hm.js。
     在脚本到位之前 push 进 _hmt 的事件会排队，百度统计自己会补发，一条不丢；
     脚本加载失败（被拦/网络）也只是队列堆着不发，不影响页面任何功能。 -->
<script>
window._hmt = window._hmt || [];
(function () {
  // 写成完整字面量，不做拼接：百度统计后台那个「代码安装检查」是扫页面源码找
  // hm.js 特征串的，拼接出来的地址它认不出来，会判成「未安装」。行为完全一样。
  var HMT_SRC = 'https://hm.baidu.com/hm.js?43c11e72955fe0c3db679ca40c371952';
  var injected = false;
  function inject() {
    if (injected) return;
    injected = true;
    var hm = document.createElement('script');
    hm.src = HMT_SRC;
    hm.async = true;
    document.head.appendChild(hm);
  }
  window.__hmtInject = inject;   // 手动触发用，自测也走这个
  if (window.addEventListener) {
    window.addEventListener('load', function () {
      if ('requestIdleCallback' in window) requestIdleCallback(inject, { timeout: 2000 });
      else setTimeout(inject, 200);
    });
  } else {
    setTimeout(inject, 3000);
  }
})();
</script>
</head>
<body>

<div id="map"></div>

<!-- 顶部筛选条 -->
<header class="bar" id="bar">
  <div class="brand">
    <span class="dot"></span>
    <b><span class="only-wide">金华徒步路线</span><span class="only-narrow">金华徒步</span></b>
    <span class="sub">数据源：两步路用户上传轨迹</span>
  </div>

  <!-- 窄屏下筛选条件收成一行，点这里展开；宽屏这个按钮不出现 -->
  <button id="btn-filter-toggle" class="filter-toggle" aria-expanded="false" aria-controls="filters">
    <span class="lbl-closed">筛选</span><span class="lbl-open">收起</span><span class="n" id="filter-count"></span><span class="caret">▾</span>
  </button>

  <div class="filters" id="filters">
    <div class="fg adv" id="fg-region">
      <label>区域</label>
      <div class="chips" data-group="region"></div>
    </div>

    <div class="fg adv" id="fg-diff">
      <label>难度</label>
      <div class="chips" data-group="difficulty"></div>
    </div>

    <div class="fg adv">
      <label>距离</label>
      <select id="f-dist">
        <option value="all">全部</option>
        <option value="s">≤ 8 km</option>
        <option value="m">8 – 15 km</option>
        <option value="l">&gt; 15 km</option>
      </select>
    </div>

    <div class="fg toggles adv">
      <label class="tg"><input type="checkbox" id="f-family"><span>亲子</span></label>
      <label class="tg"><input type="checkbox" id="f-water"><span>涉水 / 瀑布</span></label>
      <label class="tg"><input type="checkbox" id="f-wpt" checked><span>沿途标注点</span></label>
    </div>

    <div class="fg grow">
      <label>搜索</label>
      <input id="f-q" type="search" placeholder="路线名 / 描述 / 标注点，如：瀑布、古道">
    </div>

    <div class="fg adv">
      <label>排序</label>
      <select id="f-sort">
        <option value="distance">距离</option>
        <option value="ascent">爬升</option>
        <option value="name">名称</option>
      </select>
    </div>

    <button id="btn-reset" class="ghost adv">重置</button>
  </div>

  <!-- 右上角这组管「看什么」，跟上面那排筛选（筛什么）分开 -->
  <div class="map-tools" id="map-tools">
    <label class="spot-switch" title="本站自己实地打的赏秋点，与两步路的路线数据无关">
      <input type="checkbox" id="f-spots" checked><span>赏秋点</span>
    </label>
    <div class="base-switch" id="base-switch">
      <button data-base="liberty" class="on">简洁</button>
      <button data-base="topo">地形等高线</button>
      <button data-base="sat">卫星</button>
    </div>
  </div>
</header>

<!-- 右侧列表 / 详情 -->
<aside id="panel">
  <div class="panel-head">
    <button id="btn-back" class="back" hidden>‹ 返回列表</button>
    <div class="cnt"><b id="cnt-hit">0</b><span id="cnt-all">/ 0 条路线</span></div>
    <!-- 窄屏专用：把面板收成一条，给地图腾地方。宽屏面板挂在右侧，这个按钮不出现 -->
    <button id="btn-collapse" class="collapse-toggle" aria-expanded="true" title="收起面板">收起</button>
  </div>
  <div id="list" class="list"></div>
  <div id="detail" class="detail" hidden></div>
</aside>

<!-- 图例 -->
<div class="legend">
  <div><i style="background:#059669"></i>休闲</div>
  <div><i style="background:#d97706"></i>中等</div>
  <div><i style="background:#b91c1c"></i>困难</div>
  <div><i style="background:#0284c7"></i>起点</div>
  <div><i style="background:#7c3aed;border-radius:2px"></i>沿途标注</div>
  <div><i class="spot"></i>赏秋点</div>
  <div class="disc">难度＝系统按「距离＋累计爬升」判定，非两步路官方评级</div>
</div>

<div id="toast" class="toast" hidden></div>


<!-- 列表元数据 + 逻辑先上（首屏只要这两样）。maplibre（~250KB）和几何
     （~130KB）各用 async 单独拉，到位后各自回调；两个齐了才建图。 -->
<script src="data/routes.index.js"></script>
<!-- 赏秋点：本站自己打的位置，几十个点的量级，不拆包，跟元数据一起先上 -->
<script src="data/spots.js"></script>
<script src="app.js"></script>
<script async src="https://cdn.staticfile.org/maplibre-gl/5.6.0/maplibre-gl.min.js"
        onload="window.__initMap && window.__initMap()"
        onerror="window.__fallbackMapLib()"></script>
<script async src="data/routes.geom.js" onload="window.__onGeomReady && window.__onGeomReady()"></script>
</body>
</html>
