<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>金华徒步路线 · Demo</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css">

<!-- 底图在别的域，提前建连接。默认样式和瓦片全在 openfreemap，实测境内
     首次连它容易 TLS 断连，早点握手能少等一轮。 -->
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="dns-prefetch" href="https://tiles.openfreemap.org">
<link rel="dns-prefetch" href="https://tile.opentopomap.org">
<link rel="dns-prefetch" href="https://server.arcgisonline.com">
</head>
<body>

<div id="map"></div>

<!-- 顶部筛选条 -->
<header class="bar" id="bar">
  <div class="brand">
    <span class="dot"></span>
    <b><span class="only-wide">金华徒步路线</span><span class="only-narrow">金华徒步</span></b>
    <span class="sub">数据源：两步路用户上传轨迹</span>
  </div>

  <!-- 窄屏下筛选条件收成一行，点这里展开；宽屏这个按钮不出现 -->
  <button id="btn-filter-toggle" class="filter-toggle" aria-expanded="false" aria-controls="filters">
    筛选<span class="n" id="filter-count"></span><span class="caret">▾</span>
  </button>

  <div class="filters" id="filters">
    <div class="fg adv" id="fg-region">
      <label>区域</label>
      <div class="chips" data-group="region"></div>
    </div>

    <div class="fg adv" id="fg-diff">
      <label>难度</label>
      <div class="chips" data-group="difficulty"></div>
    </div>

    <div class="fg adv">
      <label>距离</label>
      <select id="f-dist">
        <option value="all">全部</option>
        <option value="s">≤ 8 km</option>
        <option value="m">8 – 15 km</option>
        <option value="l">&gt; 15 km</option>
      </select>
    </div>

    <div class="fg toggles adv">
      <label class="tg"><input type="checkbox" id="f-family"><span>亲子</span></label>
      <label class="tg"><input type="checkbox" id="f-water"><span>涉水 / 瀑布</span></label>
      <label class="tg"><input type="checkbox" id="f-wpt" checked><span>沿途标注点</span></label>
    </div>

    <div class="fg grow">
      <label>搜索</label>
      <input id="f-q" type="search" placeholder="路线名 / 描述 / 标注点，如：瀑布、古道">
    </div>

    <div class="fg adv">
      <label>排序</label>
      <select id="f-sort">
        <option value="distance">距离</option>
        <option value="ascent">爬升</option>
        <option value="name">名称</option>
      </select>
    </div>

    <button id="btn-reset" class="ghost adv">重置</button>
    <!-- 导入仅管理通道可见：默认 hidden，?admin=1 打开后由 app.js 显出来 -->
    <button id="btn-import" class="primary" hidden><span class="only-wide">导入 GPX</span><span class="only-narrow">导入</span></button>
    <input type="file" id="file-input" accept=".gpx" multiple hidden>
  </div>

  <div class="base-switch" id="base-switch">
    <button data-base="liberty" class="on">简洁</button>
    <button data-base="topo">地形等高线</button>
    <button data-base="sat">卫星</button>
  </div>
</header>

<!-- 右侧列表 / 详情 -->
<aside id="panel">
  <div class="panel-head">
    <button id="btn-back" class="back" hidden>‹ 返回列表</button>
    <div class="cnt"><b id="cnt-hit">0</b><span id="cnt-all">/ 0 条路线</span></div>
    <!-- 窄屏专用：把面板收成一条，给地图腾地方。宽屏面板挂在右侧，这个按钮不出现 -->
    <button id="btn-collapse" class="collapse-toggle" aria-expanded="true" title="收起面板">收起</button>
  </div>
  <div id="list" class="list"></div>
  <div id="detail" class="detail" hidden></div>
</aside>

<!-- 图例 -->
<div class="legend">
  <div><i style="background:#059669"></i>休闲</div>
  <div><i style="background:#d97706"></i>中等</div>
  <div><i style="background:#b91c1c"></i>困难</div>
  <div><i style="background:#0284c7"></i>起点</div>
  <div><i style="background:#7c3aed;border-radius:2px"></i>沿途标注</div>
  <div class="disc">难度＝系统按「距离＋累计爬升」判定，非两步路官方评级</div>
</div>

<div id="toast" class="toast" hidden></div>
<div id="drop" class="drop" hidden><div>松手即导入 GPX 轨迹</div></div>

<!-- 列表元数据 + 逻辑先上（首屏只要这两样）。maplibre（~250KB）和几何
     （~130KB）各用 async 单独拉，到位后各自回调；两个齐了才建图。 -->
<script src="data/routes.index.js"></script>
<script src="app.js"></script>
<script async src="vendor/maplibre-gl.js" onload="window.__initMap && window.__initMap()"></script>
<script async src="data/routes.geom.js" onload="window.__onGeomReady && window.__onGeomReady()"></script>
</body>
</html>
